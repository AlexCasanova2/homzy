<!doctype html>
<html lang="es">
  <head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-4Q8NRYW0VE"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-4Q8NRYW0VE');
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#b0552f" />
    <!-- El hero es el elemento LCP de la portada y es un background-image dentro de un
         componente que pinta Vue, así que el navegador no lo descubre hasta que ejecuta el
         bundle. Este preload lo adelanta. Va marcado como home-only porque renderShell
         reutiliza este fichero para artículos y categorías, donde el hero no se usa. -->
    <link rel="preload" as="image" href="/hero.webp" fetchpriority="high" data-homzy-home-only="true" />
    <!-- Una sola petición para las tres familias que se usan de verdad (Fraunces, Montserrat,
         Outfit). Antes había dos: esta y un @import dentro de style.css, que serializaba la
         cadena — el navegador no descubría la segunda hasta parsear el CSS. Fraunces es
         variable: pedir el rango 600..800 cuesta lo mismo que un peso suelto y hace que el
         font-weight: 800 del CSS se sirva de verdad en lugar de sintetizarse. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600..800&family=Montserrat:wght@700;800&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Homzy | Análisis de productos antes de comprar</title>
    <!-- Metas de la portada: es la única ruta que Vercel sirve como estático, porque los
         rewrites se aplican después de comprobar el sistema de ficheros. El resto de rutas
         públicas pasan por la función, que sustituye estas etiquetas por las suyas. -->
    <meta
      name="description"
      content="Análisis de productos de Amazon: especificaciones reales, pros, contras y para quién sí y para quién no. Lo que necesitas saber antes de comprar."
    />
    <link rel="canonical" href="https://homzy.es/" />
    <meta property="og:site_name" content="Homzy" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Homzy | Análisis de productos antes de comprar" />
    <meta
      property="og:description"
      content="Análisis de productos de Amazon: especificaciones reales, pros, contras y para quién sí y para quién no."
    />
    <meta property="og:url" content="https://homzy.es/" />
    <meta property="og:image" content="https://homzy.es/hero.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Homzy | Análisis de productos antes de comprar" />
    <meta
      name="twitter:description"
      content="Análisis de productos de Amazon: especificaciones reales, pros, contras y para quién sí y para quién no."
    />
    <meta name="twitter:image" content="https://homzy.es/hero.png" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
