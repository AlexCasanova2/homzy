<!doctype html>
<html lang="es">
  <head>
    <!-- El charset debe ir lo primero (la especificación pide que caiga en los primeros
         1024 bytes); antes lo precedía el script de Google Analytics. -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Google tag (gtag.js), diferido: la librería pesa 161 KB — tanto como toda la app
         tras el code-splitting — y cargaba la primera de todo el head, compitiendo por red
         y CPU en plena ruta crítica. gtag() encola en dataLayer hasta que la librería
         llega tras el load, así que no se pierde ningún evento; solo se registran tarde. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-4Q8NRYW0VE');
      window.addEventListener('load', function () {
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-4Q8NRYW0VE';
        document.head.appendChild(s);
      });
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#b0552f" />
    <!-- El hero es el elemento LCP de la portada y es un background-image dentro de un
         componente que pinta Vue, así que el navegador no lo descubre hasta que ejecuta el
         bundle. Este preload lo adelanta. Va marcado como home-only porque renderShell
         reutiliza este fichero para artículos y categorías, donde el hero no se usa. -->
    <link rel="preload" as="image" href="/hero.webp" fetchpriority="high" data-homzy-home-only="true" />
    <!-- Fuentes autoalojadas en /fonts (subset latin de Google Fonts, ficheros variables:
         un woff2 por familia cubre todos sus pesos). La cadena a Google costaba ~780 ms de
         bloqueo en móvil: conexión a fonts.googleapis.com, CSS, conexión a fonts.gstatic.com
         y recién entonces los woff2. Inline y en el mismo origen, todo eso desaparece.
         Fraunces y Outfit se precargan porque visten el título del hero y el cuerpo. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/fraunces-var.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/outfit-var.woff2" crossorigin />
    <style>
      @font-face {
        font-family: 'Fraunces';
        font-style: normal;
        font-weight: 600 800;
        font-display: swap;
        src: url(/fonts/fraunces-var.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Montserrat';
        font-style: normal;
        font-weight: 700 800;
        font-display: swap;
        src: url(/fonts/montserrat-var.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Outfit';
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url(/fonts/outfit-var.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
    </style>
    <title>Homzy | Análisis de productos antes de comprar</title>
    <!-- Metas de la portada: es la única ruta que Vercel sirve como estático, porque los
         rewrites se aplican después de comprobar el sistema de ficheros. El resto de rutas
         públicas pasan por la función, que sustituye estas etiquetas por las suyas. -->
    <meta
      name="description"
      content="Análisis de productos de Amazon: especificaciones reales, pros, contras y para quién sí y para quién no. Lo que necesitas saber antes de comprar."
    />
    <link rel="canonical" href="https://homzy.es/" />
    <meta property="og:site_name" content="Homzy" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Homzy | Análisis de productos antes de comprar" />
    <meta
      property="og:description"
      content="Análisis de productos de Amazon: especificaciones reales, pros, contras y para quién sí y para quién no."
    />
    <meta property="og:url" content="https://homzy.es/" />
    <meta property="og:image" content="https://homzy.es/hero.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Homzy | Análisis de productos antes de comprar" />
    <meta
      name="twitter:description"
      content="Análisis de productos de Amazon: especificaciones reales, pros, contras y para quién sí y para quién no."
    />
    <meta name="twitter:image" content="https://homzy.es/hero.png" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
